services:
  postgres:
    image: postgres:16-alpine
    container_name: gamesense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamesense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - gamesense-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gamesense"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gamesense-postgres-data:
